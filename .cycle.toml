[test]
fast_stages = [
  "ci-lint",
  "drift=$(gofmt -l .); [ -z \"$drift\" ] || { echo \"gofmt drift: $drift\"; exit 1; }",
  "go vet ./...",
  "go test ./...",
]
slow_stages = [
  ["go test -race ./..."],
  ["tmp=$(mktemp -d) && trap \"rm -rf $tmp\" EXIT && cp -a internal/web/templates \"$tmp/before\" && templ generate && diff -rq \"$tmp/before\" internal/web/templates"],
]
